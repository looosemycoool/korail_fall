name: korail-watch
on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: korail-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: fix smart quotes
        run: perl -CSD -pi -e 's/[\x{201C}\x{201D}]/"/g; s/[\x{2018}\x{2019}]/\x27/g' korail_watch.py
      - run: pip install korail2 requests
      - run: python korail_watch.py
        env:
          KORAIL_ID: ${{ secrets.KORAIL_ID }}
          KORAIL_PW: ${{ secrets.KORAIL_PW }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: restart myself
        run: gh workflow run watch.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
